name: 22-search-harbor
x-app: &app
  build:
    context: .
    target: runtime
  init: true
  restart: unless-stopped
x-environment: &environment
  DATABASE_URL: postgresql+asyncpg://search:search@database:5432/search
  OPENSEARCH_URL: http://opensearch:9200
  MODEL_CACHE: /models
  ADMIN_TOKEN: ${ADMIN_TOKEN:-local-demo-searchharbor-admin-change-before-deployment}
x-search: &search
  image: opensearchproject/opensearch:3.2.0
  environment:
    discovery.type: single-node
    DISABLE_INSTALL_DEMO_CONFIG: "true"
    DISABLE_SECURITY_PLUGIN: "true"
    OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nofile:
      soft: 65536
      hard: 65536
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
    interval: 5s
    timeout: 5s
    retries: 60
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: search
      POSTGRES_USER: search
      POSTGRES_PASSWORD: search
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U search -d search"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped
  opensearch:
    <<: *search
    volumes:
      - search_data:/usr/share/opensearch/data
    restart: unless-stopped
  models:
    <<: *app
    restart: "no"
    environment: *environment
    command: ["python", "-m", "searchharbor.models"]
    volumes:
      - models_data:/models
  migrate:
    <<: *app
    restart: "no"
    environment:
      <<: *environment
      CATALOG_VARIANTS: ${CATALOG_VARIANTS:-100}
    command: ["sh", "-c", "alembic upgrade head && python -m searchharbor.seed"]
    depends_on:
      database:
        condition: service_healthy
  api:
    <<: *app
    environment: *environment
    ports: ["127.0.0.1:8220:8000"]
    volumes:
      - models_data:/models:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      models:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 40
  worker:
    <<: *app
    environment:
      <<: *environment
      WORKER_AFTER_BULK_DELAY: ${WORKER_AFTER_BULK_DELAY:-0}
      BATCH_SIZE: ${BATCH_SIZE:-100}
    command: ["python", "-m", "searchharbor.indexer"]
    volumes:
      - models_data:/models:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      models:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/worker_health.py"]
      interval: 3s
      timeout: 3s
      retries: 40
  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: search
      POSTGRES_USER: search
      POSTGRES_PASSWORD: search
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U search -d search"]
      interval: 2s
      timeout: 3s
      retries: 40
  test-search:
    <<: *search
    profiles: ["test"]
    tmpfs: ["/usr/share/opensearch/data:uid=1000,gid=1000,mode=0755"]
  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql+asyncpg://search:search@test-db:5432/search
      OPENSEARCH_URL: http://test-search:9200
      TESTING: "true"
    depends_on:
      test-db:
        condition: service_healthy
      test-search:
        condition: service_healthy
    init: true
volumes:
  postgres_data:
  search_data:
  models_data:
