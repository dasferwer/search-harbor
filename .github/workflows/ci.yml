name: Проверки проекта
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Установка зависимостей
        run: uv sync --extra dev --frozen
      - name: Проверка стиля кода
        run: uv run ruff check . && uv run ruff format --check .
      - name: Запуск тестов
        run: make test
      - name: Остановка тестовых сервисов
        run: docker compose --profile test stop test-db test-search
      - name: Запуск приложения
        run: make up
      - name: Проверка API и моделей
        run: make smoke
      - name: Проверка восстановления после сбоев
        run: make recovery
      - name: Сравнение качества поиска
        run: make evaluate
      - uses: actions/upload-artifact@v4
        with:
          name: search-evaluation
          path: docs/evaluation.json
      - if: always()
        run: docker compose --profile test logs --tail=100
      - if: always()
        run: docker compose --profile test down -v
